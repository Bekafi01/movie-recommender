[server]
fileWatcherType = "none"
headless = true
enableCORS = true
enableXsrfProtection = false

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"
